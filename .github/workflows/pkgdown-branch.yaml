# Builds the pkgdown site from a pushed or chosen branch and deploys it to
# https://jakubsob.github.io/cucumber/<branch>/ without touching the main site.
on:
  push:
    branches-ignore: [main, gh-pages]
  workflow_dispatch:

name: pkgdown-branch

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.ref_name }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: ${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: |
          pkgdown::build_site(
            new_process = FALSE,
            install = FALSE,
            override = list(
              url = paste0("https://jakubsob.github.io/cucumber/", Sys.getenv("BRANCH"), "/")
            )
          )
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
          target-folder: ${{ github.ref_name }}
