url: https://jakubsob.github.io/cucumber/
home:
  title: Behavior-Driven Development in R
template:
  bootstrap: 5
  light-switch: true
  theme: a11y-light
  theme-dark: a11y-dark
  bslib:
    bg: "#fdfefc"
    fg: "#0f2a13"
    primary: "#1a6b2e"
    secondary: "#4a5d4e"
    link-color: "#1C2541"
    font-size-base: "1.0625rem"
    base_font: {google: {family: "Atkinson Hyperlegible Next", wght: [400, 700]}}
    heading_font: {google: {family: "Atkinson Hyperlegible Next", wght: [400, 700]}}
    code_font: {google: {family: "Atkinson Hyperlegible Mono", wght: [400, 700]}}
  includes:
    in_header: |
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-N7MW34VJS3"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-N7MW34VJS3');
      </script>

navbar:
  structure:
    left: [reference, gherkin-reference, articles, news]
    right: [search, github, lightswitch]
  components:
    gherkin-reference:
      text: Gherkin Reference
      href: articles/reference-gherkin.html
    articles:
      text: Articles
      menu:
        - text: Behavior-Driven Development
          href: articles/bdd.html
        - text: How it works
          href: articles/how-it-works.html
        - text: cucumber and testthat
          href: articles/testthat.html
        - text: Reports
          href: articles/reporting.html
        - text: -------
        - text: Migration guides
        - text: 3.0.0
          href: articles/migration-to-3-0-0.html
        - text: 2.0.0
          href: articles/migration-to-2-0-0.html

reference:
  - title: Add implementation
    contents:
      - hook
      - step
      - pending
      - skip_scenario
      - attachments
      - define_parameter_type
  - title: Run tests
    contents:
      - test
      - run
      - snapshots
  - title: Reporters
    contents:
      - CucumberReporter
      - CucumberProgressReporter
      - CucumberProgressBarReporter
      - CucumberDotsReporter
      - CucumberSummaryReporter
      - CucumberPrettyReporter
      - CucumberMessagesReporter
      - CucumberHtmlReporter
      - CucumberJunitReporter
      - CucumberRerunReporter
      - CucumberSnippetsReporter
      - CucumberUsageReporter
      - CucumberMultiReporter
  - title: Documentation
    contents:
      - features_rd
  - title: Options
    contents:
      - opts
  - title: Custom reports
    contents:
      - read_messages
