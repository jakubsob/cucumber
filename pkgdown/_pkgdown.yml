url: https://jakubsob.github.io/cucumber/
home:
  title: Behavior-Driven Development in R
template:
  bootstrap: 5
  light-switch: true
  theme: a11y-light
  theme-dark: a11y-dark
  bslib:
    bg: "#fdfefc"
    fg: "#0f2a13"
    primary: "#1a6b2e"
    secondary: "#4a5d4e"
    link-color: "#1C2541"
    font-size-base: "1.0625rem"
    border-radius: 0
    border-radius-sm: 0
    border-radius-lg: 0
    border-radius-xl: 0
    border-radius-xxl: 0
    border-radius-pill: 0
    base_font: {google: {family: "Atkinson Hyperlegible Next", wght: [400, 700]}}
    heading_font: {google: {family: "Atkinson Hyperlegible Next", wght: [400, 700]}}
    code_font: {google: {family: "Atkinson Hyperlegible Mono", wght: [400, 700]}}
  includes:
    in_header: |
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-N7MW34VJS3"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-N7MW34VJS3');
      </script>

navbar:
  structure:
    left: [get-started, guides, reference, gherkin-reference, migrate, news]
    right: [search, github, lightswitch]
  components:
    get-started:
      text: Get started
      href: articles/get-started.html
    guides:
      text: Guides
      menu:
        - text: Behavior-Driven Development
          href: articles/bdd.html
        - text: How it works
          href: articles/how-it-works.html
        - text: cucumber and testthat
          href: articles/testthat.html
        - text: Reports
          href: articles/reporting.html
    gherkin-reference:
      text: Gherkin
      href: articles/reference-gherkin.html
    reference:
      text: Functions
      href: reference/index.html
    migrate:
      text: Upgrade
      menu:
        - text: To 3.0.0
          href: articles/migration-to-3-0-0.html
        - text: To 2.0.0
          href: articles/migration-to-2-0-0.html

reference:
  - title: Write steps and hooks
    desc: Connect the text of a scenario to R code.
    contents:
      - step
      - hook
      - define_parameter_type
      - pending
      - skip_scenario
      - attachments
  - title: Run features
    desc: Run feature files on their own, or inside testthat.
    contents:
      - test
      - run
      - snapshots
  - title: Console reporters
    desc: Show the progress of a run in the console.
    contents:
      - CucumberProgressReporter
      - CucumberProgressBarReporter
      - CucumberDotsReporter
      - CucumberSummaryReporter
      - CucumberPrettyReporter
  - title: Report files
    desc: Write a report of a run to a file.
    contents:
      - CucumberHtmlReporter
      - CucumberJunitReporter
      - CucumberMessagesReporter
  - title: Find what to fix
    desc: Reports that list what is left to do.
    contents:
      - CucumberRerunReporter
      - CucumberSnippetsReporter
      - CucumberUsageReporter
  - title: Combine and extend reporters
    desc: Use several reporters in one run, or write your own.
    contents:
      - CucumberMultiReporter
      - CucumberReporter
      - read_messages
  - title: Configure and document
    desc: Options of a run, and scenarios in help pages.
    contents:
      - opts
      - features_rd
